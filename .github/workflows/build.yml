name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: yes | sdkmanager --licenses > /dev/null
      - run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - name: Build
        run: |
          set -o pipefail
          if ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log; then
            echo "## Build OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Build failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -A 40 "What went wrong" build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || tail -80 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flint-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
